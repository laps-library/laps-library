workflows:
  ios-production:
    name: LAPS iOS Production
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: laps-asc-key
    environment:
      node: 22
      vars:
        BUNDLE_ID: "com.laps.app"
        ASC_TEAM_ID: "B6K7H25PWD"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install dependencies
        script: |
          cd apps/mobile
          npm install
      - name: Expo prebuild
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --clean --non-interactive
      - name: Install CocoaPods
        script: |
          cd apps/mobile/ios
          pod install
      - name: Set up signing
        script: |
          echo "base64 length: ${#IOS_P12_BASE64}"
          echo "password length: ${#IOS_P12_PASSWORD}"
          echo "$IOS_P12_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/dist.p12
          ls -la /tmp/dist.p12
          security import /tmp/dist.p12 -P "$IOS_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security find-identity -v -p codesigning
          cd apps/mobile/ios
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Increment build number
        script: |
          cd apps/mobile/ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 21)
          agvtool new-version -all $((LATEST + 1))
      - name: Build and export IPA
        script: |
          cd apps/mobile/ios
          PROFILE_PATH=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision | head -1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          IDENTITY=$(security find-identity -v -p codesigning | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Profile: $PROFILE_NAME"
          echo "Identity: $IDENTITY"
          xcodebuild -workspace LAPS.xcworkspace -scheme LAPS -configuration Release \
            -archivePath build/LAPS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$ASC_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/LAPS.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
    artifacts:
      - apps/mobile/ios/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
